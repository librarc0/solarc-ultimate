# ── 真实 IP 提取（Docker 网桥 / 反向代理场景）─────────────────────
# Docker bridge 网关是唯一可信的直连代理，从其转发的 X-Forwarded-For
# 最后一跳提取真实客户端 IP，覆盖 $remote_addr（$binary_remote_addr 同步更新）
# 若前方还有 CDN 或多层反向代理，将可信出口 IP 段也加入此处
set_real_ip_from 172.16.0.0/12;   # Docker 默认网段（含 172.17-172.31）
set_real_ip_from 10.0.0.0/8;      # 其他内网网段（按需保留）
real_ip_header    X-Forwarded-For;
real_ip_recursive on;              # 递归剥离，防止客户端伪造 XFF 头

# ── Rate Limit Zones ───────────────────────────────────────────────
# 使用 $binary_remote_addr：经过 real_ip_module 处理后，此变量已为真实客户端 IP
# 公开排行榜：60 req/min（burst=20 允许短时突发）
limit_req_zone $binary_remote_addr zone=public_limit:10m  rate=60r/m;
# 登录接口：5 req/min（限制暴力破解）
limit_req_zone $binary_remote_addr zone=login_limit:10m   rate=5r/m;
# 文档限流
limit_req_zone $binary_remote_addr zone=docs_rate_limit:10m rate=30r/m;
# 限流超限返回 429（Too Many Requests）而非默认 503
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 减小跨境代理传输体积，弱网下首屏更稳定
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 统一代理超时，避免上游代理抖动导致请求过早失败
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    # 上游 keepalive 复用连接，降低握手成本
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── 安全：拦截 WordPress / PHP 探测请求 ────────────────────
    # 攻击者常用路径扫描，直接返回 404 避免暴露 SPA 兜底的 200
    location ~* /(wp-includes|wp-admin|wp-login|xmlrpc)/ {
        return 404;
    }
    location ~* \.(php|asp|aspx|jsp)$ {
        return 404;
    }

    # Vue Router — redirect all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must not be cached so browsers always get the latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets have content-hashed filenames — safe to cache long-term
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 认证接口（严格限流：防暴力破解）───────────────────────
    # ^~ 较长前缀优先级高于下方 /api/，无需嵌套
    location ^~ /api/v1/auth/ {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ── 公开排行榜（宽松限流）─────────────────────────────────
    location ^~ /api/v1/public/ {
        limit_req zone=public_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ── 通用 API（无限流：小团队私有应用，登录接口已单独保护）────
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Proxy uploaded files (avatars, team logos) to backend
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /docs-files/ {
        limit_req zone=docs_rate_limit burst=20 nodelay;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
